schema_version = 1
project = "gotth-authentik"
profile = "strict"
active = "extraction"

[settings]
worktree_root = "worktrees"
workflow_root = "workflow"
default_branch = "main"

[toolchain]
build = "go build ./..."
test = "go test -mod=readonly -race -cover ./..."
lint = "go vet -mod=readonly ./..."
format = "gofmt -w"
coverage = "go test -mod=readonly -coverprofile=coverage.out ./..."

[coverage]
map = "workflow/artifacts/global-coverage-map.md"
profile = "strict"
block_unresolved_high_risk = true
exception_expiry_days = 14

[feature.extraction]
id = "extraction"
slug = "extraction"
name = "Extract generic Authentik desired-state toolkit"
namespace = "authentik"
parent = ""
state = "done"
risk = "high"
assurance = "traceable-tests"
created_at = "2026-09-02T23:36:00Z"
activated_at = "2026-09-02T23:36:00Z"
updated_at = "2026-09-02T23:50:00Z"
completed_at = "2026-09-02T23:50:00Z"
folder = "workflow/features/extraction"
worktree = "."
branch = "main"
scope = ["Extract enrollment blueprint, URL, and application-isolation contracts"]
non_goals = ["Change a live Authentik tenant", "Store Authentik credentials", "Run another service"]
affected_files = ["**"]
invariants = ["Each application has an isolated access group", "Activation requires successful email verification", "Remote mutation remains explicit"]
acceptance = ["Local validation, deterministic generation, race, vet, and coverage gates pass", "Accepted alpha.2 blueprint is retained as provenance", "Disposable Authentik import is an explicit gate before consumer release"]

[feature.extraction.rollback]
strategy = "delete_unpublished_repository"
notes = "No live Authentik state changes during extraction"
data_loss_risk = false
requires_migration_down = false

[[feature.extraction.verification]]
id = "verify"
kind = "unit"
command = "make verify"
required = true
timeout_seconds = 600
side_effect = "local_write"
network = false
retries = 0
